name: Web application checks

on:
  push:
    branches: [main, feature/hybrid-video-catalogue, ryko-ecosystem-upgrades, security-hardening-2026-11]
  pull_request:
    branches: [main, ryko-ecosystem-upgrades]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/video-metadata/index.ts && deno check supabase/functions/video-report/index.ts
