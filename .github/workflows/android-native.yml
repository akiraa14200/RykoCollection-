name: Build RykoCollection Native Android

on:
  workflow_dispatch:
  push:
    branches: [kotlin-native]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble native debug APK
        run: gradle -p native-android :app:assembleDebug --no-daemon
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Kotlin-Native-debug-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
