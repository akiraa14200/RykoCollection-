name: Build RykoCollection Native Android

on:
  workflow_dispatch:
  push:
    branches: [kotlin-native]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.13
          INSTALL_DIR="$RUNNER_TEMP/gradle"
          ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          mkdir -p "$INSTALL_DIR"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            "https://downloads.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$ZIP"
          unzip -q "$ZIP" -d "$INSTALL_DIR"
          echo "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$INSTALL_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version
      - name: Assemble native debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Retry transient dependency repository gateway failures, but fail immediately on code errors.
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            set +e
            gradle -p native-android :app:assembleDebug --no-daemon 2>&1 | tee "build-attempt-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP response: 5[0-9]{2}|status code 5[0-9]{2}|Gateway Time-out|Could not GET' "build-attempt-${attempt}.log"; then
              exit "${status}"
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Dependency server returned a gateway error; waiting 30 seconds before retry."
              sleep 30
            fi
          done
          echo "Build failed after 3 attempts due to repeated dependency repository errors."
          exit 1
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Kotlin-Native-debug-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
