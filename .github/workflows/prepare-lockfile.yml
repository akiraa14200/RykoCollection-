name: Prepare dependency lockfile
on:
  push:
    branches:
      - fix/production-audit-2026-11
    paths-ignore:
      - package-lock.json
      - '**.md'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-audit-2026-11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible dependency tree
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit lockfile
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add reproducible npm dependency lockfile"
            git push origin HEAD:fix/production-audit-2026-11
          fi
