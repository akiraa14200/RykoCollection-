name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, ryko-collection-catalogue-app, feature/hybrid-video-catalogue, hybrid-native-merge]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'public/**'
      - 'branding/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate or reuse Android project
        run: |
          if [ -d android/app ]; then
            echo "Using the checked-in Android project"
            npx cap sync android
          else
            echo "Generating the initial Capacitor Android project"
            npx cap add android
          fi

      - name: Verify Android application identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('capacitor.config.ts', 'utf8');
          if (!config.includes("appId: 'com.rykocollection.app'")) {
            throw new Error('capacitor.config.ts must use com.rykocollection.app');
          }
          console.log('Verified Android application id: com.rykocollection.app');
          NODE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply RykoCollection app icon and splash
        run: |
          python -m pip install --quiet pillow
          python scripts/android-branding.py

      - name: Allow one-tap media playback in Android WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not files:
              raise SystemExit("Generated Capacitor MainActivity.java was not found")
          path = files[0]
          source = path.read_text()
          if "setMediaPlaybackRequiresUserGesture(false)" not in source:
              method = """
                @Override
                public void onCreate(android.os.Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    if (bridge != null && bridge.getWebView() != null) {
                        bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                    }
                }
              """
              source = source.rstrip()
              if not source.endswith("}"):
                  raise SystemExit("Unexpected MainActivity.java structure")
              source = source[:-1] + method + chr(10) + "}" + chr(10)
              path.write_text(source)
          print("Enabled first-tap media playback in", path)
          PY

      - name: Copy web assets into Android app
        run: npx cap sync android

      - name: Configure resilient Maven Central mirror
        run: |
          cat > "$RUNNER_TEMP/ryko-maven-mirror.init.gradle" <<'GRADLE'
          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
          gradle.beforeProject { project ->
              project.buildscript.repositories.maven {
                  name = 'googleMavenCentralMirror'
                  url = mirrorUrl
              }
              project.repositories.maven {
                  name = 'googleMavenCentralMirror'
                  url = mirrorUrl
              }
          }
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories.maven {
                  name = 'googleMavenCentralMirror'
                  url = mirrorUrl
              }
              try {
                  settings.dependencyResolutionManagement.repositories.maven {
                      name = 'googleMavenCentralMirror'
                      url = mirrorUrl
                  }
              } catch (Exception ignored) {
                  // Older generated projects may not use dependencyResolutionManagement.
              }
          }
          GRADLE

      - name: Integrate Strawhat Pirate native browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          app = root / "app"
          source = Path("native/strawhat/StrawhatBrowserActivity.kt").read_text()
          target = app / "src/main/java/com/rykocollection/app/browser/StrawhatBrowserActivity.kt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          assets = app / "src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "music_player.html").write_text(Path("native/strawhat/music_player.html").read_text())

          # The generated Capacitor Android project normally includes Kotlin support.
          root_gradle = root / "build.gradle"
          if not root_gradle.exists():
              root_gradle = root / "build.gradle.kts"
          root_text = root_gradle.read_text()
          if "kotlin-gradle-plugin" not in root_text:
              if root_gradle.suffix == ".kts":
                  root_text = re.sub(r"dependencies\s*\{", 'dependencies {\n        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")', root_text, count=1)
              else:
                  root_text = re.sub(r"dependencies\s*\{", 'dependencies {\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"', root_text, count=1)
              root_gradle.write_text(root_text)

          app_gradle = app / "build.gradle"
          if not app_gradle.exists():
              app_gradle = app / "build.gradle.kts"
          app_text = app_gradle.read_text()
          if "kotlin-android" not in app_text and "org.jetbrains.kotlin.android" not in app_text:
              if app_gradle.suffix == ".kts":
                  app_text = 'plugins { id("org.jetbrains.kotlin.android") }\\n' + app_text
              else:
                  app_text = app_text.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'", 1)
              app_gradle.write_text(app_text)

          manifest = app / "src/main/AndroidManifest.xml"
          xml = manifest.read_text()
          activity = '<activity android:name=".browser.StrawhatBrowserActivity" android:exported="false" android:configChanges="orientation|screenSize|keyboardHidden" />'
          if "StrawhatBrowserActivity" not in xml:
              xml = xml.replace("</application>", "        " + activity + "\n    </application>")
          manifest.write_text(xml)

          # Expose one narrowly-scoped bridge method to open the browser activity from Ryko settings.
          java_files = list((app / "src/main/java").rglob("MainActivity.java"))
          if not java_files:
              raise SystemExit("Capacitor MainActivity.java not found")
          main = java_files[0]
          java = main.read_text()
          bridge_code = """
                  if (bridge != null && bridge.getWebView() != null) {
                      bridge.getWebView().addJavascriptInterface(new Object() {
                          @android.webkit.JavascriptInterface
                          public void openStrawhatBrowser() {
                              MainActivity.this.runOnUiThread(() ->
                                  MainActivity.this.startActivity(new android.content.Intent(
                                      MainActivity.this,
                                      com.rykocollection.app.browser.StrawhatBrowserActivity.class
                                  ))
                              );
                          }
                      }, "RykoNative");
                  }
          """
          if 'addJavascriptInterface(new Object()' not in java or '"RykoNative"' not in java:
              needle = "super.onCreate(savedInstanceState);"
              position = java.find(needle)
              if position < 0:
                  raise SystemExit("Could not find Capacitor MainActivity onCreate")
              insert_at = position + len(needle)
              java = java[:insert_at] + "\n" + bridge_code + java[insert_at:]
              main.write_text(java)

          print("Integrated Strawhat Pirate browser activity, music asset and RykoNative launcher.")
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --init-script "$RUNNER_TEMP/ryko-maven-mirror.init.gradle"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency resolution failed; retrying in 20 seconds (attempt $attempt/3)..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RykoCollection-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Keep this workflow available for isolated hybrid-video-catalogue branch validation.
